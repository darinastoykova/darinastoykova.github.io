  </g>
  <!-- selected component -->
  <g filter="url(#s)">
    <rect x="70" y="332" width="150" height="104" rx="12" fill="#FFFFFF"/>
    <rect x="86" y="350" width="34" height="34" rx="9" fill="#1F7A4C"/>
