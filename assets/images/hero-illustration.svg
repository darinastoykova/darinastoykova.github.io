    <rect x="243" y="445" width="14" height="14" rx="3" fill="#C8653A"/>
  </g>
  <!-- pen nib: tip sits exactly on the end of the curve -->
  <g transform="translate(484 296) rotate(45)" shape-rendering="geometricPrecision">
    <path d="M0 0L-11 -24Q-12 -27 -9 -28H9Q12 -27 11 -24Z" fill="#1B2B23" stroke="#1B2B23" stroke-width="2" stroke-linejoin="round"/>
