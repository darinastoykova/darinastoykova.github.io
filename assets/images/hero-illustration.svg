    <rect x="278" y="237" width="96" height="7" rx="3.5" fill="#DCE5DF"/>
    <rect x="278" y="258" width="66" height="22" rx="11" fill="#1F7A4C"/>
    <rect x="150" y="298" width="80" height="56" rx="8" fill="#EEF5F0"/>
    <rect x="240" y="298" width="80" height="56" rx="8" fill="#EEF5F0"/>
    <rect x="330" y="298" width="80" height="56" rx="8" fill="#EEF5F0"/>
    <rect x="160" y="310" width="22" height="22" rx="6" fill="#A9CDB5"/>
