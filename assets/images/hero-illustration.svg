    <rect x="132" y="150" width="300" height="222" rx="14" fill="#FFFFFF"/>
    <path d="M132 164a14 14 0 0 1 14-14h272a14 14 0 0 1 14 14v14H132z" fill="#1B2B23"/>
    <circle cx="150" cy="165" r="4" fill="#E9A178"/><circle cx="164" cy="165" r="4" fill="#E2BC55"/><circle cx="178" cy="165" r="4" fill="#A9CDB5"/>
    <rect x="150" y="196" width="112" height="84" rx="8" fill="#A9CDB5"/>
