<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 540 540" shape-rendering="geometricPrecision" role="img" aria-labelledby="t">
  <title id="t">A web page layout taking shape, with a pen-tool curve and a selected component</title>
  <defs>
    <filter id="s" filterUnits="userSpaceOnUse" x="-60" y="-60" width="660" height="660" color-interpolation-filters="sRGB"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#14211A" flood-opacity=".12"/></filter>
  </defs>
  <!-- ground shapes -->
  <path d="M86 300c-18-70 30-150 104-170 40-11 66-48 116-52 78-6 150 50 160 128 8 62 40 92 22 150-20 66-92 98-170 92-46-4-74 22-128 18-62-5-90-56-104-166z" fill="#FFFFFF"/>
  <circle cx="378" cy="196" r="126" fill="#F6D9C4"/>
  <path d="M112 318c-6-64 38-120 100-128 42-6 62-40 108-36 60 5 96 52 98 104 2 44 30 64 18 106-14 50-64 72-122 68-40-3-60 14-104 10-58-6-92-50-98-124z" fill="#CFE4D6"/>
  <!-- browser window -->
