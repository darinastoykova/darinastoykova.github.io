    <rect x="57" y="439" width="10" height="10"/><rect x="223" y="439" width="10" height="10"/>
  </g>
  <!-- pen tool curve: two cubics split from one (de Casteljau), so the join is perfectly smooth -->
  <g shape-rendering="geometricPrecision" stroke-linecap="round" stroke-linejoin="round">
    <path d="M326.4 448.4L386.7 385.9" stroke="#C8653A" stroke-width="1.6" opacity=".6"/>
